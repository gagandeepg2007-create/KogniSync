version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kognisync-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kognisync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kognisync_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kognisync_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kognisync} -d ${POSTGRES_DB:-kognisync_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kognisync-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
